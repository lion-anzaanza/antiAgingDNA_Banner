<!-- SNS 공유 미리보기(OG) 이미지 원본. 이 파일을 브라우저로 열어 1200x630으로 캡처하면 public/og.png 가 됩니다. -->
<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  :root{--grad-main:linear-gradient(135deg,#f5b8e6 0%,#d1aeef 48%,#aebdf5 100%);--accent-pink:#f0b3e0;--accent-lilac:#cdaded;--accent-periwinkle:#aebdf5;--bg:#fbf7fd;--card-alpha:rgba(255,255,255,.72);--line:#ece4f5;--text:#3a2e5c;--text-soft:#5c5380}
  *{margin:0;box-sizing:border-box}
  html,body{width:1200px;height:630px;overflow:hidden;font-family:Pretendard,sans-serif;color:var(--text);word-break:keep-all}
  body{background:var(--bg);position:relative}
  .blob{position:absolute;border-radius:50%;filter:blur(70px)}
  .b1{width:560px;height:560px;left:-140px;top:-200px;background:var(--accent-pink);opacity:.38}
  .b2{width:620px;height:620px;right:-180px;top:-120px;background:var(--accent-periwinkle);opacity:.42}
  .b3{width:520px;height:520px;left:38%;bottom:-320px;background:var(--accent-lilac);opacity:.36}
  .wrap{position:relative;height:100%;padding:56px 84px;display:flex;flex-direction:column;justify-content:center}
  .badge{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:999px;background:var(--card-alpha);border:1px solid var(--line);font-size:22px;font-weight:700;letter-spacing:.04em;width:max-content}
  h1{margin-top:22px;font-size:110px;line-height:1;font-weight:800;letter-spacing:-.03em}
  h1 span{background:var(--grad-main);-webkit-background-clip:text;background-clip:text;color:transparent}
  .tag{margin-top:22px;font-size:40px;font-weight:600;line-height:1.3;max-width:760px}
  .sub{margin-top:14px;font-size:25px;color:var(--text-soft);line-height:1.5;max-width:720px}
  .logo{position:absolute;right:84px;top:50%;transform:translateY(-50%);width:300px;height:300px;filter:drop-shadow(0 30px 60px rgba(80,50,120,.28))}
  .cta{position:relative;margin-top:30px;width:max-content;display:inline-flex;align-items:center;padding:16px 32px;border-radius:18px;background:var(--grad-main);color:#fff;font-size:26px;font-weight:700;box-shadow:0 14px 34px rgba(170,140,220,.35);overflow:hidden}
  .cta::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,0) 45%)}
  .cta span{position:relative}
  .url{position:absolute;right:84px;bottom:56px;font-size:22px;font-weight:600;color:var(--text-soft)}
</style></head>
<body>
  <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
  <div class="wrap">
    <div class="badge">🔒 COMING SOON</div>
    <h1>Life<span>DNA</span></h1>
    <p class="tag">매일의 기록으로 나를<br>유전자처럼 읽어내는 웰니스 앱</p>
    <p class="sub">웨어러블 없이, 스마트폰 기록만으로 시작해요</p>
    <div class="cta"><span>사전예약 신청하기 →</span></div>
  </div>
  <img class="logo" src="../public/logo.png" alt="">
  <div class="url">lifedna.anzaanza.cloud</div>
</body></html>
